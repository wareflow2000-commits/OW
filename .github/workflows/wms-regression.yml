name: WMS regression checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/wms-regression.test.mjs
