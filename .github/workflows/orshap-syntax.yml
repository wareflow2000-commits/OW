name: ORSHAP WMS syntax validation

on:
  push:
    branches:
      - audit/v13.9.58-dropdown-unification
  pull_request:
    branches:
      - main

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application JavaScript syntax
        run: |
          set -eu
          for file in app.js SQLite-db.js supabase-client.js sw.js; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              node --check "$file"
            else
              echo "Required JavaScript file missing: $file" >&2
              exit 1
            fi
          done
      - name: Validate offline app-shell references
        run: node scripts/check-app-shell.cjs
      - name: Validate critical RPC idempotency contracts
        run: node scripts/check-critical-rpc-contracts.cjs
